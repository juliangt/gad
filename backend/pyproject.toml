[project]
name = "gad"
version = "0.1.0"
description = "GAD backend API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "GAD Team", email = "dev@gad.local" }]
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "alembic>=1.14.0,<2.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "psycopg2-binary>=2.9.10,<2.10.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "passlib[argon2]>=1.7.4,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "authlib>=1.4.0,<2.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "redis[hiredis]>=5.2.0,<6.0.0",
    "slowapi>=0.1.9,<0.2.0",
    "structlog>=24.4.0,<25.0.0",
    "python-multipart>=0.0.20,<0.1.0",
    "email-validator>=2.2.0,<3.0.0",
    "geoalchemy2>=0.16.0,<0.17.0",
    "httpx>=0.28.1,<0.29.0",
    "pillow>=12.3.0",
    "apscheduler>=3.11.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.25.0,<0.26.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "httpx>=0.28.1,<0.29.0",
    "testcontainers[postgres,redis]>=4.8.0,<5.0.0",
    "respx>=0.22.0,<0.23.0",
    "freezegun>=1.5.1,<2.0.0",
    "ruff>=0.8.0,<0.9.0",
    "mypy>=1.13.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gad"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
