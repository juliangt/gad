name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev --all-packages

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test
        run: uv run pytest --cov=gad --cov-report=xml -v

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: backend/coverage.xml

  # Valida que la imagen de tests se construya y los tests pasen DENTRO de
  # Docker (con testcontainers levantando contenedores hermanos vía socket).
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.test
          tags: gad-backend-test:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in Docker
        run: ./run-tests-docker.sh
        env:
          NO_BUILD: "1"
        working-directory: backend

  # Frontend: type-check, unit tests (Vitest) y build de producción.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  # E2E con Playwright contra el stack completo (docker compose prod-like).
  # No bloqueante al principio (continue-on-error): el stack en CI puede tener
  # flakiness hasta afinar timings de healthcheck/seed/proxy. Para endurecerlo,
  # pasar continue-on-error a false y exigir el job en branch protection.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Bring up the stack
        run: |
          docker compose up --build -d
          # Esperar a que nginx (web) responda y el proxy /api/health llegue al backend.
          timeout 180 bash -c '
            until curl -sf http://localhost:5173/ >/dev/null && \
                  curl -sf http://localhost:5173/api/health >/dev/null; do
              echo "Esperando stack..."
              sleep 3
            done
          '
          # Dar margen al servicio seed (one-shot) a poblar los datos.
          timeout 120 bash -c '
            until docker compose ps seed | grep -q "exited (0)"; do
              echo "Esperando seed..."
              sleep 3
            done
          '

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: frontend/test-results

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs
